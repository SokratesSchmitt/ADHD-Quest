<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff7a00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ADHD Quest">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/avatar/avatar_happy.png">
  <title>ADHD QUEST | Version 0.30</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app-shell">

    <!-- ==================================================================
         TÄGLICHER 5-SEKUNDEN INTRO-SPLASH-SCREEN (1x pro Tag beim 1. Start)
         ================================================================== -->
    <div class="intro-overlay hidden" id="intro-screen" onclick="dismissIntroScreen()">
      <div class="intro-zoom-container">
        <img src="aq_schriftzugtitle.png" alt="ADHD Quest Startbild" id="intro-splash-img" class="intro-splash-img">
      </div>
      <div class="intro-version-badge">Version 0.30 • Tippen zum Überspringen</div>
    </div>

    <!-- ==================================================================
         CLEAN FULLSCREEN HUD (v0.30): NUR SCHWEBENDER PROFILRAHMEN OBEN LINKS
         ================================================================== -->
    <div class="floating-avatar-hud">
      <div class="avatar-popout-wrapper" onclick="openCharacterModal()" title="Charakterbogen, Werte & 10 Avatar-States öffnen">
        <div class="avatar-ring-bg" id="avatar-progress-ring"></div>
        <img src="assets/avatar/avatar_happy.png" alt="Paddy Avatar" id="header-avatar-img" class="avatar-popout-sprite">
      </div>
    </div>

    <!-- ==================================================================
         HAUPT-SPIELFELD: AKTUELLER RAUM MIT FREIGESTELLTEN ORIGINAL-SPRITES
         ================================================================== -->
    <main class="room-canvas" id="room-canvas" data-room="Flur">
      <div id="room-hotspots-layer" class="hotspots-layer"></div>
      <!-- Raum-Spielerfigur entfernt (v0.30) für ruhigere Raum-Ansicht -->
      <div id="loot-toast" class="loot-toast hidden"></div>
    </main>

    <!-- ==================================================================
         MODAL 1: OBJEKT-INTERAKTION / AUFGABE ABHAKEN
         ================================================================== -->
    <div class="modal-backdrop" id="object-modal" onclick="if(event.target===this) closeModal('object-modal')">
      <div class="modal-card">
        <div class="modal-header">
          <span id="obj-modal-title">Aufgabe</span>
          <button class="modal-close" onclick="closeModal('object-modal')">✕</button>
        </div>
        <div class="modal-body" style="text-align:center;">
          <div id="obj-modal-preview-wrap" style="margin-bottom:10px; display:flex; justify-content:center; align-items:center;">
            <div id="obj-modal-icon" style="font-size:42px;">✨</div>
          </div>
          <p id="obj-modal-desc" style="font-size:15px; font-weight:700; color:#1e293b; margin-bottom:10px;"></p>
          <div id="obj-modal-rewards" class="reward-badges-row"></div>
          <button class="primary-action-btn" id="obj-complete-btn" onclick="confirmObjectAction()">
            ✨ Loot sammeln & abhaken!
          </button>
        </div>
      </div>
    </div>

    <!-- ==================================================================
         MODAL 2: NEUE INTERAKTIVE WOHNUNGS-MAP (MIT FREIGESTELLTEN RÄUMEN)
         ================================================================== -->
    <div class="modal-backdrop" id="map-modal" onclick="if(event.target===this) closeModal('map-modal')">
      <div class="modal-card map-only-card">
        <div class="modal-header">
          <span>🗺️ Wohnungs-Grundriss (Raum antippen)</span>
          <button class="modal-close" onclick="closeModal('map-modal')">✕</button>
        </div>
        <div class="modal-body map-only-body">
          <div class="interactive-map-canvas" id="interactive-map-canvas"></div>
        </div>
      </div>
    </div>

    <!-- ==================================================================
         MODAL 3: BELOHNUNGS-SHOP
         ================================================================== -->
    <div class="modal-backdrop" id="shop-modal" onclick="if(event.target===this) closeModal('shop-modal')">
      <div class="modal-card">
        <div class="modal-header">
          <span>🐷 Dopamin-Shop & Belohnungen</span>
          <button class="modal-close" onclick="closeModal('shop-modal')">✕</button>
        </div>
        <div class="modal-body" id="shop-modal-body"></div>
      </div>
    </div>

    <!-- ==================================================================
         MODAL 4: TAGESCHRONIK, INTRO-TEST & BACKUP
         ================================================================== -->
    <div class="modal-backdrop" id="log-modal" onclick="if(event.target===this) closeModal('log-modal')">
      <div class="modal-card">
        <div class="modal-header">
          <span>📜 Tageschronik & System (v0.30)</span>
          <button class="modal-close" onclick="closeModal('log-modal')">✕</button>
        </div>
        <div class="modal-body">
          <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
            <button class="secondary-btn" onclick="replayDailyIntro()">🎬 5s-Tages-Intro testen</button>
            <button class="secondary-btn" onclick="manualSheetSync()">☁️ Sheet-Sync (GET)</button>
            <button class="secondary-btn" onclick="Engine.exportBackup()">💾 Backup speichern</button>
          </div>
          <div id="log-entries-list" class="log-list"></div>
        </div>
      </div>
    </div>

    <!-- ==================================================================
         MODAL 5: RAUM-AUFGABENBUCH (ALLE GEGENSTÄNDE AUS SPALTE M & N)
         ================================================================== -->
    <div class="modal-backdrop" id="room-book-modal" onclick="if(event.target===this) closeModal('room-book-modal')">
      <div class="modal-card">
        <div class="modal-header">
          <span id="room-book-title">📋 Raum-Aufgabenbuch</span>
          <button class="modal-close" onclick="closeModal('room-book-modal')">✕</button>
        </div>
        <div class="modal-body" id="room-book-body" style="max-height:68vh; overflow-y:auto;"></div>
      </div>
    </div>

    <!-- ==================================================================
         MODAL 6: CHARAKTERBOGEN & 10 SPIELERFIGUR-STATES (DESIGNREFERENZ)
         ================================================================== -->
    <div class="modal-backdrop" id="character-modal" onclick="if(event.target===this) closeModal('character-modal')">
      <div class="modal-card">
        <div class="modal-header">
          <span>🧢 Charakter & 10 Spielerfigur-States</span>
          <button class="modal-close" onclick="closeModal('character-modal')">✕</button>
        </div>
        <div class="modal-body" id="character-modal-body" style="max-height:70vh; overflow-y:auto;"></div>
      </div>
    </div>

  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
